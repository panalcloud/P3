name: CI

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # a job container is required so that the postgres service is reachable
    # under the hostname 'postgres' (see P3ClientTest class >> #url)
    container: node:24
    services:
      postgres:
        image: postgres:18
        # empty password
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        # the connect string should now be
        # postgres://postgres:postgres@postgres:5432/postgres
        # health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-14, Pharo64-13, Pharo64-12 ]
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v5
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: CI-${{ matrix.smalltalk }}
          token: ${{ secrets.CODECOV_TOKEN }}
